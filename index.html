  .donut-wrap{display:flex;align-items:center;gap:20px;padding:18px;} .donut{width:132px;height:132px;flex:none;} .donut .dbg{fill:none;stroke:var(--surface-3);stroke-width:13;} .donut .dfg{fill:none;stroke-width:13;stroke-linecap:round;transform:rotate(-90deg);transform-origin:65px 65px;} .donut .dval{font-size:26px;font-weight:800;fill:var(--ink);text-anchor:middle;} .donut .dsub{font-size:10px;font-weight:600;fill:var(--muted);text-anchor:middle;letter-spacing:.04em;}
  .stat-legend{display:flex;flex-direction:column;gap:9px;flex:1;} .sl{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;} .sl .dot{width:10px;height:10px;border-radius:3px;flex:none;} .sl .v{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;} .sl .k{color:var(--ink-2);}

  .who-cell{width:130px;white-space:nowrap;} .who-cell .av{display:inline-flex;align-items:center;gap:9px;} .who-cell .avd{width:28px;height:28px;border-radius:50%;background:var(--accent-wash);color:var(--accent-ink);align-items:center;justify-content:center;display:inline-flex;font-weight:700;font-size:12px;flex:none;} .who-cell b{font-size:13.5px;}

if (typeof google === 'undefined' || !(google.script && google.script.run)) {
  (function(){
    function Runner(){ this._s=function(){}; this._f=function(){}; }
    Runner.prototype.withSuccessHandler=function(fn){ this._s=fn||function(){}; return this; };
    Runner.prototype.withFailureHandler=function(fn){ this._f=fn||function(){}; return this; };
    ['getReportData','saveWeek','deleteWeek','renameWeek','importAssets'].forEach(function(name){
      Runner.prototype[name]=function(){ var args=[].slice.call(arguments), self=this;
        fetch('/api/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:name,args:args})})
          .then(function(r){ return r.json(); })
          .then(function(j){ if(j&&j.ok) self._s(j.result); else self._f(new Error(j&&j.error?j.error:'서버 오류')); })
          .catch(function(e){ self._f(e); });
        return this; };
    });
    window.google={script:{}}; Object.defineProperty(window.google.script,'run',{get:function(){return new Runner();}});
  })();
}

    var catCard='<div class="card"><div class="card-h"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="7"/><rect x="12" y="6" width="3" height="11"/><rect x="17" y="13" width="3" height="4"/></svg></span><h3>분류별 이번주 업무</h3></div><div class="hbars">'+bars(catOrder.map(function(c){return {k:c,v:catMap[c]};}))+'</div></div>';

    var issCard='<div class="card"><div class="card-h"><span class="ico" style="background:var(--critical-wash);color:var(--critical)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg></span><h3>이슈·보류 하이라이트</h3><span class="r">'+issues.length+'건</span></div><div class="mini-list">'+(issues.length?issues.map(function(it){ var c=stClass(it.st); return '<div class="mini"><span class="mk pill '+(c==='hold'?'hold':'issue')+'">'+h(it.st)+'</span><span class="body"><div class="mt">'+h(it.text)+'</div><div class="mw">'+h(it.who)+'</div></span></div>'; }).join(''):'<div class="empty">이슈·보류가 없습니다. 👍</div>')+'</div></div>';
    return '<div class="page-head"><h1>대시보드</h1><span class="sub">'+h(m.week||sel)+' · '+h(fmtRange(m))+' 분석 요약</span></div>'+

  /* ---- section views ---- */
  function taskUl(list,who){ if(!list.length) return '<span class="empty">—</span>';
    return '<ul class="tasks">'+list.map(function(t){ var c=stClass(t.status); var k=(who||'')+'|'+(t.text||'').trim(); var st=(who&&STUCK[k]>=2)?' <span class="chip warn">⏳'+STUCK[k]+'주째</span>':'';
      return '<li class="'+c+'">'+h(t.text)+(t.status?' <span class="tag '+c+'">'+h(t.status)+'</span>':'')+(t.cat?' <span class="chip cat">'+h(t.cat)+'</span>':'')+(t.prio==='높음'?' <span class="chip hi">높음</span>':'')+st+(t.done?' <span class="donedt num">✓'+h(String(t.done).slice(5))+'</span>':'')+'</li>'; }).join('')+'</ul>'; }

  function vFacilityView(){ if(!D.facility.length) return cardEmpty();
    var order=D.facility.slice().sort(function(a,b){ return (String(a[0]).indexOf('다음')>-1?1:0)-(String(b[0]).indexOf('다음')>-1?1:0); });
    var rows=order.map(function(r){ var c=stClass(r[5]); return '<tr><td>'+(String(r[0]).indexOf('다음')>-1?'<span class="chip cat">다음주</span>':'<span class="chip acc" style="background:var(--accent-wash);color:var(--accent-ink)">이번주</span>')+'</td><td>'+(r[1]?'<span class="sched">'+h(r[1])+'</span>':'<span class="dash">–</span>')+'</td><th>'+h(r[2])+'</th><td>'+cell(r[3])+'</td><td>'+h(r[4])+'</td><td>'+(r[5]?'<span class="tag '+c+'">'+h(r[5])+'</span>':'<span class="dash">–</span>')+'</td></tr>'; }).join('');
    return '<div class="card tbl-scroll"><table class="grid"><thead><tr><th>시점</th><th>일정</th><th>위치</th><th>분류</th><th>세부내용</th><th>상태</th></tr></thead><tbody>'+rows+'</tbody></table></div>'; }
  function cell(v){ return (v==='–'||v===''||v==null)?'<span class="dash">–</span>':h(v); }
  function cellNum(v){ return (v===''||v==null)?'<span class="dash">–</span>':h(v); }
  function aset(cell2,grp,prevS){ var g=grp?' grp':''; if(!cell2) return '<td class="n'+g+'"><span class="dash">–</span></td><td class="n"><span class="dash">–</span></td><td class="n"><span class="dash">–</span></td>';
    var d=''; if(prevS!=null){ var pa=num0(prevS),pb=num0(cell2.s); if(pa!=null&&pb!=null&&pa!==pb){ d=' <span class="'+(pb>pa?'d-dn':'d-up')+'">'+(pb>pa?'▲':'▼')+Math.abs(pb-pa)+'</span>'; } }
    return '<td class="n'+g+'">'+cellNum(cell2.o)+'</td><td class="n">'+cellNum(cell2.i)+'</td><td class="n">'+cellNum(cell2.s)+d+'</td>'; }
  function vAssets(){ if(!D.assets.length) return cardEmpty();

    var rows=order.map(function(k){ var mm=map[k]; return '<tr><th>'+h(mm.region)+'</th><td>'+h(mm.item)+'</td>'+aset(mm.tw,false,null)+aset(mm.nw,true,mm.tw?mm.tw.s:null)+'</tr>'; }).join('');

    var rows=D.facility.map(function(r){ return [C(h(r[0]),'c'),C(mutTxt(r[1]),'c'),h(r[2]),h(r[3]),h(r[4]),C(stTxt(r[5]),'c')]; });
    return ptbl([{t:'시점',c:'c'},{t:'일정',c:'c'},'위치','분류','세부내용',{t:'상태',c:'c'}],rows); }
  function pdfAssets(){ if(!D.assets.length) return '<p class="mut">내용 없음</p>';
    var map={},order=[]; D.assets.forEach(function(r){ var k=r[1]+'|'+r[2]; if(!(k in map)){map[k]={region:r[1],item:r[2],tw:null,nw:null};order.push(k);} var c={o:r[3],i:r[4],s:r[5]}; if(String(r[0]).indexOf('다음')>-1)map[k].nw=c;else map[k].tw=c; });
    function cs(c,g){ if(!c) return [C('–','n'+(g?' grp2':'')),C('–','n'),C('–','n')]; return [C(mutTxt(c.o),'n'+(g?' grp2':'')),C(mutTxt(c.i),'n'),C(mutTxt(c.s),'n')]; }
    var rows=order.map(function(k){ var mm=map[k]; return [h(mm.region),h(mm.item)].concat(cs(mm.tw,false)).concat(cs(mm.nw,true)); });
    return ptbl(['지역','품목',{t:'금주 OUT',c:'n'},{t:'IN',c:'n'},{t:'재고',c:'n'},{t:'차주 OUT',c:'n grp2'},{t:'IN',c:'n'},{t:'재고',c:'n'}],rows); }
  function pdfContracts(){ if(!D.contracts.length) return '<p class="mut">내용 없음</p>';
    var rows=D.contracts.map(function(r){ return [h(r[0]),h(r[1]),C(mutTxt(r[2]),'c'),C(ddayTxt(r[2]),'c'),mutTxt(r[3])]; });
    return ptbl(['구분','계약·서비스명',{t:'만료일',c:'c'},{t:'D-day',c:'c'},'비고'],rows); }
  function pdfNotes(){ if(!D.notes.length) return '<p class="mut">내용 없음</p>';
    var rows=D.notes.map(function(r){ var period=(r[3]||'')+(r[4]&&r[4]!==r[3]?(' ~ '+r[4]):''); return [C(h(r[0]),'c'),h(r[1]),h(r[2]),C(mutTxt(period),'c')]; });
    return ptbl([{t:'구분',c:'c'},'대상','내용',{t:'기간',c:'c'}],rows); }
  document.getElementById('pdfBtn').addEventListener('click',function(){ if(!D)return; var m=D.meta;
    var head='<div class="p-title"><h1>주간업무보고 · '+h(m.dept)+'</h1><div class="p-meta">'+h(m.week)+'  |  기간 '+h(fmtRange(m))+'  |  작성 '+h(m.date)+'</div></div>';
    var secs=[['1. 팀원별 업무 진행 현황',pdfTeam()],['2. 사무실별 시설 현황',pdfFac()],['3. 주요 비품 현황',pdfAssets()],['4. 계약 & 서비스 만료',pdfContracts()],['5. 기타 특이사항',pdfNotes()]];
    var body=secs.map(function(s){ return '<section class="p-sec"><h2>'+h(s[0])+'</h2>'+s[1]+'</section>'; }).join('');
    document.getElementById('printArea').innerHTML=head+body; window.print(); });

  /* ---- boot ---- */
  function ingest(res){ weeks=res.weeks||[]; members=res.members||[]; ALL={team:res.team||[],facility:res.facility||[],assets:res.assets||[],contracts:res.contracts||[],notes:res.notes||[]}; if(res.sheetUrl){ var l=document.getElementById('sheetLink'); l.href=res.sheetUrl; l.style.display='inline-flex'; } }
  function pickWeek(keep){ if(keep&&weeks.some(function(w){return w.week===keep;})) return keep; return weeks.length?weeks[weeks.length-1].week:'26년 7월 1주차'; }
  function boot(res){ if(!res||!res.dbReady){ app.innerHTML=noDB(); return; } ingest(res); active='home'; selectWeek(pickWeek(null)); }
  function reload(keep){ google.script.run.withSuccessHandler(function(res){ if(!res||!res.dbReady) return; ingest(res); selectWeek(pickWeek(keep)); }).withFailureHandler(function(){}).getReportData(); }
  function noDB(){ return '<div class="banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg><span>시트 DB가 아직 없습니다. Apps Script에서 <b>resetAll()</b> 을 실행하세요.</span></div>'; }
  if(typeof google!=='undefined'&&google.script&&google.script.run){ google.script.run.withSuccessHandler(boot).withFailureHandler(function(err){ app.innerHTML='<div class="banner">데이터 로드 실패: '+h(err&&err.message?err.message:err)+'</div>'; }).getReportData(); }
  else { app.innerHTML='<div class="banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01"/></svg><span>Google Apps Script 웹앱 URL에서 실행하세요.</span></div>'; }
})();
</script>
</body>
</html>
